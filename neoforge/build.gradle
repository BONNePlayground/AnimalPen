plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-neoforge-api:${rootProject.jei_version}")
    // at runtime, use the full JEI jar for Forge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${rootProject.jei_version}")
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("run/client1"))
        }
        client2 {
            client()
            gameDirectory = this.mkdir(this.file("run/client2"))
            programArguments.addAll '--username', 'Dev2'
        }
        server {
            server()
            this.file("run/server/$minecraft_version").createParentDirectories()
            gameDirectory = this.mkdir(this.file("run/server/$minecraft_version"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir rootProject.file('common/src/main/generated/')
    exclude '.cache/**'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.version}-${rootProject.minecraft_version}-NeoForge"
    versionType = "release"
    uploadFile = tasks.named("jar").get().archiveFile.get().asFile
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["neoforge"]
    dependencies {
        optional.project "patchouli"
        optional.project "cloth-config"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

tasks.register('curseforge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(1206722, remapJar)

    mainFile.displayName =
            "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version}-${rootProject.mod_version}"

    mainFile.changelog = rootProject.file("CHANGELOG_LATEST.md").text
    mainFile.changelogType = "text"
    mainFile.releaseType = "release"

    mainFile.addGameVersion("26.1", "26.1.1", "26.1.2")
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 25")
    mainFile.addEnvironment("Client", "Server")

    mainFile.addOptional("patchouli")
    mainFile.addOptional("cloth-config")
}