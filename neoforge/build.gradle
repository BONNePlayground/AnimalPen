plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

loom {
    runs {
        devClient {
            client()
            programArg("--username=Dev")
        }

        dev2Client {
            client()
            programArg("--username=Dev2")
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.mod_version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.mod_version}-${rootProject.minecraft_version}-NeoForge"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.20.5","1.20.6"]
    loaders = ["neoforge"]
    dependencies {
        required.project "architectury-api"
        optional.project "patchouli"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "1206722"
        changelog = rootProject.file("CHANGELOG_LATEST.md").text
        changelogType = "text"
        releaseType = "release"
        addGameVersion "1.20.5"
        addGameVersion "1.20.6"
        addGameVersion "NeoForge"
        addGameVersion "Java 21"

        relations {
            requiredDependency "architectury-api"
            optionalDependency "patchouli"
        }
        mainArtifact(remapJar) {
            displayName = "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version}-${rootProject.mod_version}"
        }
        options {
            javaVersionAutoDetect = false
        }
    }
}