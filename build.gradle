plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xdoclint:none"
}

tasks.register("generateDatapack", Zip) {
    group = "mod"
    description = "Assembles the standalone datapack."

    // ── pack.mcmeta ──────────────────────────────────────────────────────
    def mcmeta = """
{
  "pack": {
    "pack_format": ${pack_version},
    "description": "Animal Pens data pack v${version}"
  }
}
"""

    // ── shared resources from common ─────────────────────────────────────
    if (findProject(":common") != null) {

        from("${project(":common").projectDir}/src/main/generated") {
            include "data/minecraft/**"
            include "data/animal_pen/loot_table/animal_interactions/**"
            include "data/animal_pen/tags/entity_type/**"
            include "data/animal_pen/tags/item/**"
            exclude "data/animal_pen/tags/item/animal_pens.json"
            exclude "data/animal_pen/tags/item/aviaries.json"
            duplicatesStrategy = DuplicatesStrategy.WARN
        }
    }

    // ── pack.mcmeta injection ────────────────────────────────────────────
    doFirst {
        def metaDir = project(":common").layout.buildDirectory
                .dir("tmp/datapack-meta")
                .get().asFile

        metaDir.mkdirs()
        new File(metaDir, "pack.mcmeta").text = mcmeta

        from(metaDir)
    }

    archiveFileName = "${archives_name}-datapack-${minecraft_version}-${version}.zip"

    destinationDirectory = layout.buildDirectory.dir("datapacks").get().asFile

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named("generateDatapack") {
    dependsOn(":neoforge:runData")
}