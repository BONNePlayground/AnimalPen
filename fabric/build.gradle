plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

repositories {
    maven {
        name "ModMenu Maven"
        url "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Nucleoid"
        url "https://maven.nucleoid.xyz/"
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    runs {
        devClient {
            client()
            programArg("--username=Dev")
        }

        dev2Client {
            client()
            programArg("--username=Dev2")
        }
    }
}

sourceSets {
    main {
        resources {
            exclude '**/.cache/**'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation(include("eu.pb4:placeholder-api:${rootProject.placeholder_api_version}")) {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${rootProject.jei_version}")
    // at runtime, use the full JEI jar for Fabric
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${rootProject.jei_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.mod_version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.mod_version}-${rootProject.minecraft_version}-Fabric"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.20.3","1.20.4"]
    loaders = ["fabric"]
    dependencies {
        required.project "architectury-api"
        required.project "fabric-api"
        optional.project "patchouli"
        optional.project "cloth-config"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "1206722"
        changelog = rootProject.file("CHANGELOG_LATEST.md").text
        changelogType = "text"
        releaseType = "release"
        addGameVersion "1.20.3"
        addGameVersion "1.20.4"
        addGameVersion "Fabric"
        addGameVersion "Java 17"

        relations {
            requiredDependency "architectury-api"
            requiredDependency "fabric-api"
            optionalDependency "patchouli-fabric"
            optionalDependency "cloth-config"
        }
        mainArtifact(remapJar) {
            displayName = "${rootProject.archives_name}-fabric-${rootProject.minecraft_version}-${rootProject.mod_version}"
        }
        options {
            javaVersionAutoDetect = false
        }
    }
}