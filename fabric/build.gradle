plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.mod_version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.mod_version}-${rootProject.minecraft_version}-Fabric"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.18.2"]
    loaders = ["fabric"]
    dependencies {
        required.project "architectury-api"
        required.project "fabric-api"
        optional.project "patchouli"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "1206722"
        changelog = rootProject.file("CHANGELOG_LATEST.md").text
        changelogType = "text"
        releaseType = "release"
        addGameVersion "1.18.2"
        addGameVersion "Fabric"
        addGameVersion "Java 17"

        relations {
            requiredDependency "architectury-api"
            requiredDependency "fabric-api"
            optionalDependency "patchouli-fabric"
        }
        mainArtifact(remapJar) {
            displayName = "${rootProject.archives_name}-fabric-${rootProject.minecraft_version}-${rootProject.mod_version}"
        }
        options {
            javaVersionAutoDetect = false
        }
    }
}