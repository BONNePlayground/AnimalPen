plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}")

    implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}")

    runtimeOnly("eu.pb4:placeholder-api:${rootProject.placeholder_api_version}")

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${rootProject.jei_version}")
    // at runtime, use the full JEI jar for Fabric
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${rootProject.jei_version}")
}

loom {
    def aw = file("src/main/resources/${mod_id}.classTweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
            programArg("--username=Dev")
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets.main.resources {
    srcDir rootProject.file('common/src/main/generated/')
    exclude '.cache/**'
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.version}-${rootProject.minecraft_version}-Fabric"
    versionType = "release"
    uploadFile = tasks.named("jar").get().archiveFile.get().asFile
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        optional.project "patchouli"
        optional.project "cloth-config"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "1206722"
        changelog = rootProject.file("CHANGELOG_LATEST.md").text
        changelogType = "text"
        releaseType = "release"
        addGameVersion "26.1"
        addGameVersion "26.1.1"
        addGameVersion "26.1.2"
        addGameVersion "Fabric"
        addGameVersion "Java 25"

        relations {
            requiredDependency "fabric-api"
            optionalDependency "patchouli-fabric"
            optionalDependency "cloth-config"
        }
        mainArtifact(tasks.named("jar").get().archiveFile.get().asFile) {
            displayName = "${rootProject.archives_name}-fabric-${rootProject.minecraft_version}-${rootProject.version}"
        }
        options {
            javaVersionAutoDetect = false
        }
    }
}