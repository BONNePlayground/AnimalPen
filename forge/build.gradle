plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

loom {
    forge {
        mixinConfig "animal_pen.mixins.json"
        mixinConfig "animal_pen-forge.mixins.json"
    }

    runs {
        dataGen {
            data()
            programArg("--mod")
            programArg("animal_pen")
            programArg("--server")
            programArg("--output")
            programArg(file('src/main/generated/').absolutePath)
            programArg("--existing")
            programArg(file('src/main/resources/').absolutePath)
        }

        devClient {
            client()
            programArg("--username=Dev")
        }

        dev2Client {
            client()
            programArg("--username=Dev2")
        }
    }
}

sourceSets {
    main {
        resources.srcDir 'src/main/generated'
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.mod_version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.mod_version}-${rootProject.minecraft_version}-Forge"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.20.2"]
    loaders = ["forge"]
    dependencies {
        required.project "architectury-api"
        optional.project "patchouli"
        optional.project "cloth-config"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

curseforge {
    project {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        id = "1206722"
        changelog = rootProject.file("CHANGELOG_LATEST.md").text
        changelogType = "text"
        releaseType = "release"
        addGameVersion "1.20.2"
        addGameVersion "Forge"
        addGameVersion "Java 17"

        relations {
            requiredDependency "architectury-api"
            optionalDependency "patchouli"
            optionalDependency "cloth-config"
        }
        mainArtifact(remapJar) {
            displayName = "${rootProject.archives_name}-forge-${rootProject.minecraft_version}-${rootProject.mod_version}"
        }
        options {
            javaVersionAutoDetect = false
        }
    }
}