plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

loom {
    forge {
        mixinConfig "animal_pen.mixins.json"
        mixinConfig "animal_pen-forge.mixins.json"
    }

    runs {
        client {
            client()
            programArg("--username=Dev")
            runDir("run/client1")
        }

        client2 {
            client()
            programArg("--username=Dev2")
            runDir("run/client2")
        }

        server {
            server()
            runDir("run/server/$minecraft_version")
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.4"))

    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"

    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-forge-api:${rootProject.jei_version}")
    // at runtime, use the full JEI jar for Forge
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${rootProject.jei_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "animalpens"
    versionNumber = "${rootProject.mod_version}-${rootProject.minecraft_version}"
    versionName = "${rootProject.mod_version}-${rootProject.minecraft_version}-Forge"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.19.1", "1.19.2"]
    loaders = ["forge"]
    dependencies {
        required.project "architectury-api"
        optional.project "patchouli"
        optional.project "cloth-config"
    }
    changelog = rootProject.file("CHANGELOG_LATEST.md").text

    syncBodyFrom = rootProject.file("README.md").text
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

tasks.register('curseforge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(1206722, remapJar)

    mainFile.displayName = "${rootProject.archives_name}-forge-${rootProject.minecraft_version}-${rootProject.mod_version}"
    mainFile.changelog = rootProject.file("CHANGELOG_LATEST.md").text
    mainFile.changelogType = "text"
    mainFile.releaseType = "release"

    mainFile.addGameVersion("1.19.1", "1.19.2")
    mainFile.addModLoader("Forge")
    mainFile.addJavaVersion("Java 17")
    mainFile.addEnvironment("Server", "Client")

    mainFile.addRequirement("architectury-api")
    mainFile.addOptional("patchouli")
    mainFile.addOptional("cloth-config")
}